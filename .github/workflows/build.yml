name: Build apps

on:
  push:
    branches: [main, v1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK (ARM64)
    runs-on: [self-hosted, Linux, X64, docker]
    timeout-minutes: 60
    env:
      CI: 'true'
    steps:
      - name: Install build prerequisites
        shell: bash
        run: |
          if [ "$(id -u)" -eq 0 ]; then
            apt-get update
            apt-get install -y --no-install-recommends build-essential ca-certificates curl git libssl-dev pkg-config unzip zip
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential ca-certificates curl git libssl-dev pkg-config unzip zip
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.1.0 ndk;30.0.16248370'

      - name: Select NDK
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          targets: aarch64-linux-android

      - run: npm ci

      - name: Ensure sideload signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Build APK
        run: npm run tauri -- android build --ci --target aarch64 --apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kingsmith-android-arm64
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS app (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          targets: aarch64-apple-darwin

      - run: npm ci
      - run: cargo test --workspace --locked

      - name: Build app
        run: npm run tauri -- build --target aarch64-apple-darwin --bundles app --ci

      - name: Archive app preserving permissions and bundle metadata
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "target/aarch64-apple-darwin/release/bundle/macos/Kingsmith Controller.app" \
            kingsmith-macos-arm64.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kingsmith-macos-arm64
          path: kingsmith-macos-arm64.zip
          if-no-files-found: error
          retention-days: 14
